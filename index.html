<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alice's Birthday Hunt 🧩</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f7f3ed;
    color: #29251f;
}

body {
    overflow-x: hidden;
}

button,
input {
    font-family: inherit;
}

.screen {
    min-height: 100vh;
    padding: 24px 18px 40px;
}

.container {
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
}

/* ---------------- HEADER ---------------- */

.header {
    text-align: center;
    margin-bottom: 22px;
}

.header h1 {
    font-size: 27px;
    margin: 0 0 7px;
    font-weight: 750;
    letter-spacing: -0.5px;
}

.header p {
    margin: 0;
    color: #777066;
    font-size: 14px;
}

/* ---------------- PROGRESS ---------------- */

.progress-wrap {
    margin: 0 auto 22px;
}

.progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #81786d;
    margin-bottom: 7px;
}

.progress-bar {
    height: 7px;
    background: #e5ded4;
    border-radius: 99px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    width: 0%;
    background: #6d8065;
    border-radius: 99px;
    transition: width 0.35s ease;
}

/* ---------------- PUZZLE ---------------- */

.puzzle-wrap {
    position: relative;
    width: 100%;
    max-width: 440px;
    aspect-ratio: 1 / 1;
    margin: 0 auto 25px;
}

.puzzle-grid {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 7px;
    transition:
        gap 0.9s cubic-bezier(.2,.8,.2,1),
        padding 0.9s cubic-bezier(.2,.8,.2,1);
    position: relative;
    z-index: 2;
}

.puzzle-grid.assembling {
    gap: 0;
}

.puzzle-tile {
    position: relative;
    width: 100%;
    height: 100%;
    perspective: 1000px;
    cursor: pointer;
    border-radius: 13px;
    overflow: hidden;
}

.tile-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(.2,.75,.25,1);
}

.puzzle-tile.flipped .tile-inner {
    transform: rotateY(180deg);
}

.tile-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 13px;
    overflow: hidden;
}

/* FRONT */

.tile-front {
    background:
        linear-gradient(145deg, #8c9b82, #65735d);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
}

.tile-front span {
    color: white;
    font-weight: 700;
    font-size: 15px;
    line-height: 1.2;
    text-shadow: 0 1px 3px rgba(0,0,0,.2);
}

/* BACK */

.tile-back {
    transform: rotateY(180deg);
    background-size: 300% 300%;
    background-repeat: no-repeat;
    background-image: url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=90");
    box-shadow: 0 3px 12px rgba(0,0,0,.14);
}

/*
Each tile shows a different section of the restaurant image.
*/

.pos-0 { background-position: 0% 0%; }
.pos-1 { background-position: 50% 0%; }
.pos-2 { background-position: 100% 0%; }

.pos-3 { background-position: 0% 50%; }
.pos-4 { background-position: 50% 50%; }
.pos-5 { background-position: 100% 50%; }

.pos-6 { background-position: 0% 100%; }
.pos-7 { background-position: 50% 100%; }
.pos-8 { background-position: 100% 100%; }


/* ---------------- ASSEMBLED IMAGE ---------------- */

.assembled-image {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 13px;
    opacity: 0;
    transform: scale(.985);
    transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.2,.8,.2,1),
        border-radius .8s ease;
    z-index: 1;
}

.assembled-image.visible {
    opacity: 1;
    transform: scale(1);
    border-radius: 0;
}

.puzzle-grid.finished {
    opacity: 0;
    pointer-events: none;
}

.puzzle-grid.finished + .assembled-image {
    z-index: 5;
}


/* ---------------- INSTRUCTION ---------------- */

.instruction {
    text-align: center;
    font-size: 14px;
    color: #81786d;
    line-height: 1.5;
    min-height: 22px;
    margin-bottom: 17px;
}


/* ---------------- BUTTONS ---------------- */

.main-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    background: #29372a;
    color: white;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(0,0,0,.12);
    transition: transform .15s ease, opacity .15s ease;
}

.main-button:active {
    transform: scale(.98);
}

.main-button.secondary {
    background: #e6ded3;
    color: #443e36;
    margin-top: 10px;
}


/* ---------------- PHOTO INPUT ---------------- */

.photo-input {
    display: none;
}


/* ---------------- COMPLETION MESSAGE ---------------- */

.final-container {
    position: relative;
    width: 100%;
    max-width: 520px;
    margin: 0 auto;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,.18);
}

.final-container img {
    display: block;
    width: 100%;
    height: auto;
    min-height: 430px;
    object-fit: cover;
}

.final-overlay {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 70px 22px 24px;
    background: linear-gradient(
        to top,
        rgba(0,0,0,.78),
        rgba(0,0,0,.25),
        transparent
    );
    color: white;
    text-align: center;
}

.final-overlay h2 {
    margin: 0 0 8px;
    font-size: 23px;
    line-height: 1.2;
}

.final-overlay p {
    margin: 0;
    font-size: 17px;
    line-height: 1.45;
    font-weight: 500;
}


/* ---------------- PHOTOS MODAL ---------------- */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(25,22,18,.72);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
}

.modal.open {
    opacity: 1;
    pointer-events: auto;
}

.modal-card {
    width: 100%;
    max-width: 540px;
    max-height: 88vh;
    overflow-y: auto;
    background: #f8f5f0;
    border-radius: 24px 24px 0 0;
    padding: 22px 18px 30px;
    transform: translateY(30px);
    transition: transform .3s ease;
}

.modal.open .modal-card {
    transform: translateY(0);
}

.modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
}

.modal-header h2 {
    margin: 0;
    font-size: 21px;
}

.close-button {
    border: none;
    background: #e6ded3;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

.photo-list {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.submitted-photo {
    background: white;
    border-radius: 13px;
    overflow: hidden;
    box-shadow: 0 3px 10px rgba(0,0,0,.08);
}

.submitted-photo img {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
}

.submitted-photo-title {
    padding: 9px 10px 11px;
    font-size: 13px;
    font-weight: 700;
    color: #4d463d;
}

.empty-photos {
    text-align: center;
    color: #81786d;
    padding: 30px 10px;
    grid-column: 1 / -1;
}


/* ---------------- HIDDEN STATES ---------------- */

.hidden {
    display: none !important;
}


/* ---------------- RESPONSIVE ---------------- */

@media (max-width: 380px) {

    .screen {
        padding-left: 14px;
        padding-right: 14px;
    }

    .header h1 {
        font-size: 24px;
    }

    .tile-front span {
        font-size: 13px;
    }

}
</style>
</head>

<body>

<div class="screen" id="mainScreen">

    <div class="container">

        <div class="header">
            <h1>Alice's Birthday Hunt 🧩</h1>
            <p>Complete each challenge to reveal the picture.</p>
        </div>

        <div class="progress-wrap">
            <div class="progress-text">
                <span id="progressText">0 of 9 revealed</span>
                <span id="progressPercent">0%</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>


        <div class="puzzle-wrap">

            <div class="puzzle-grid" id="puzzleGrid"></div>

            <img
                id="assembledImage"
                class="assembled-image"
                src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=90"
                alt="Restaurant"
            >

        </div>


        <div class="instruction" id="instruction">
            Complete the first challenge to begin...
        </div>


        <input
            type="file"
            accept="image/*"
            capture="environment"
            class="photo-input"
            id="photoInput"
        >


        <button
            class="main-button"
            id="viewPhotosButton"
            type="button"
        >
            📸 View My Photos
        </button>

    </div>

</div>


<!-- FINAL VIEW -->

<div class="screen hidden" id="finalScreen">

    <div class="container">

        <div class="final-container">

            <img
                src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=90"
                alt="Restaurant"
            >

            <div class="final-overlay">

                <h2>You've finished the puzzle and the trek! ❤️</h2>

                <p>
                    It's time to celebrate...<br>
                    Come on a birthday date with me? 🎂❤️
                </p>

            </div>

        </div>


        <button
            class="main-button"
            id="viewPhotosFinalButton"
            type="button"
            style="margin-top:18px;"
        >
            📸 View My Photos
        </button>

    </div>

</div>


<!-- PHOTO MODAL -->

<div class="modal" id="photoModal">

    <div class="modal-card">

        <div class="modal-header">

            <h2>Your Photos 📸</h2>

            <button
                class="close-button"
                id="closeModal"
                type="button"
            >
                ×
            </button>

        </div>

        <div class="photo-list" id="photoList"></div>

    </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

const clues = [
    "Something Green",
    "Railway Bridge",
    "Rushing Water",
    "Rocky Gorge",
    "Natural Arch",
    "Stone Bridge",
    "Deep Woodland",
    "The Falls",
    "The Way Back"
];


/* =========================================================
   RESTAURANT IMAGE
========================================================= */

const restaurantImage =
    "https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=90";


/* =========================================================
   STORAGE
========================================================= */

const PROGRESS_KEY = "alice_birthday_bruar_progress_v4";
const PHOTOS_KEY = "alice_birthday_bruar_photos_v4";


let progress = Number(
    localStorage.getItem(PROGRESS_KEY) || 0
);

let submittedPhotos = [];

try {

    submittedPhotos =
        JSON.parse(
            localStorage.getItem(PHOTOS_KEY) || "[]"
        );

} catch {

    submittedPhotos = [];

}


/* =========================================================
   ELEMENTS
========================================================= */

const puzzleGrid =
    document.getElementById("puzzleGrid");

const assembledImage =
    document.getElementById("assembledImage");

const photoInput =
    document.getElementById("photoInput");

const instruction =
    document.getElementById("instruction");

const progressText =
    document.getElementById("progressText");

const progressPercent =
    document.getElementById("progressPercent");

const progressFill =
    document.getElementById("progressFill");

const viewPhotosButton =
    document.getElementById("viewPhotosButton");

const viewPhotosFinalButton =
    document.getElementById("viewPhotosFinalButton");

const photoModal =
    document.getElementById("photoModal");

const closeModal =
    document.getElementById("closeModal");

const photoList =
    document.getElementById("photoList");

const mainScreen =
    document.getElementById("mainScreen");

const finalScreen =
    document.getElementById("finalScreen");


let selectedTile = null;
let isSubmitting = false;


/* =========================================================
   BUILD PUZZLE
========================================================= */

function buildPuzzle() {

    puzzleGrid.innerHTML = "";

    for (let i = 0; i < 9; i++) {

        const tile = document.createElement("div");

        tile.className = "puzzle-tile";

        if (i < progress) {
            tile.classList.add("flipped");
        }

        tile.dataset.index = i;


        const inner =
            document.createElement("div");

        inner.className = "tile-inner";


        /* FRONT */

        const front =
            document.createElement("div");

        front.className = "tile-face tile-front";


        const title =
            document.createElement("span");

        title.textContent = clues[i];

        front.appendChild(title);


        /* BACK */

        const back =
            document.createElement("div");

        back.className =
            "tile-face tile-back pos-" + i;

        back.style.backgroundImage =
            `url("${restaurantImage}")`;


        inner.appendChild(front);
        inner.appendChild(back);

        tile.appendChild(inner);

        puzzleGrid.appendChild(tile);


        tile.addEventListener("click", () => {

            if (isSubmitting) return;

            if (i < progress) return;

            if (i > progress) return;

            if (progress >= 9) return;

            selectedTile = i;

            /*
             Immediately open the camera/photo picker.
            */

            photoInput.value = "";

            photoInput.click();

        });

    }

    updateProgress();

}


/* =========================================================
   UPDATE PROGRESS
========================================================= */

function updateProgress() {

    const percent =
        Math.round((progress / 9) * 100);

    progressText.textContent =
        `${progress} of 9 revealed`;

    progressPercent.textContent =
        `${percent}%`;

    progressFill.style.width =
        `${percent}%`;


    if (progress === 0) {

        instruction.textContent =
            "Tap the first card and complete the challenge.";

    } else if (progress < 9) {

        instruction.textContent =
            `Find "${clues[progress]}" and take a photo.`;

    } else {

        instruction.textContent =
            "You did it! Tap the completed picture ❤️";

    }


    localStorage.setItem(
        PROGRESS_KEY,
        progress
    );
}


/* =========================================================
   PHOTO SELECTION
========================================================= */

photoInput.addEventListener(
    "change",
    handlePhoto
);


function handlePhoto(event) {

    const file =
        event.target.files[0];

    if (!file) return;

    if (selectedTile === null) return;

    if (isSubmitting) return;

    isSubmitting = true;


    const tileIndex =
        selectedTile;


    /*
       Read the photo immediately.
    */

    const reader =
        new FileReader();


    reader.onload = function(e) {

        /*
           Save a compressed version.
           This keeps localStorage from filling up.
        */

        compressImage(
            e.target.result,
            900,
            0.72,
            function(compressedPhoto) {

                submittedPhotos.push({

                    title: clues[tileIndex],

                    image: compressedPhoto,

                    time: Date.now()

                });


                localStorage.setItem(
                    PHOTOS_KEY,
                    JSON.stringify(submittedPhotos)
                );


                /*
                   IMPORTANT:
                   Flip the tile immediately.
                   No page reload.
                */

                flipTileImmediately(tileIndex);


                /*
                   Update progress immediately.
                */

                progress++;

                selectedTile = null;

                isSubmitting = false;

                updateProgress();


                if (progress >= 9) {

                    setTimeout(
                        prepareAssembly,
                        650
                    );

                }

            }
        );

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   IMMEDIATE TILE FLIP
========================================================= */

function flipTileImmediately(index) {

    const tile =
        puzzleGrid.children[index];

    if (!tile) return;


    /*
       Force the browser to recognise the
       class change immediately.
    */

    requestAnimationFrame(() => {

        tile.classList.add("flipped");

    });

}


/* =========================================================
   COMPRESS PHOTOS
========================================================= */

function compressImage(
    dataUrl,
    maxSize,
    quality,
    callback
) {

    const img =
        new Image();


    img.onload = function() {

        let width =
            img.width;

        let height =
            img.height;


        if (width > height) {

            if (width > maxSize) {

                height =
                    Math.round(
                        height *
                        (maxSize / width)
                    );

                width =
                    maxSize;

            }

        } else {

            if (height > maxSize) {

                width =
                    Math.round(
                        width *
                        (maxSize / height)
                    );

                height =
                    maxSize;

            }

        }


        const canvas =
            document.createElement("canvas");

        canvas.width =
            width;

        canvas.height =
            height;


        const ctx =
            canvas.getContext("2d");

        ctx.drawImage(
            img,
            0,
            0,
            width,
            height
        );


        callback(
            canvas.toDataURL(
                "image/jpeg",
                quality
            )
        );

    };


    img.src =
        dataUrl;

}


/* =========================================================
   ASSEMBLE PUZZLE
========================================================= */

function prepareAssembly() {

    instruction.textContent =
        "You found every piece... tap the picture ❤️";


    /*
       Make the completed puzzle tappable.
    */

    puzzleGrid.style.cursor =
        "pointer";


    puzzleGrid.onclick =
        function() {

            if (progress < 9) return;

            puzzleGrid.onclick = null;

            assemblePuzzle();

        };

}


/* =========================================================
   ASSEMBLE
========================================================= */

function assemblePuzzle() {

    instruction.textContent =
        "Putting the pieces together...";


    /*
       First remove the individual gaps.
    */

    puzzleGrid.classList.add(
        "assembling"
    );


    /*
       Give the gaps time to close,
       then reveal one seamless image.
    */

    setTimeout(() => {

        puzzleGrid.classList.add(
            "finished"
        );

        assembledImage.classList.add(
            "visible"
        );


        setTimeout(() => {

            /*
               Keep the assembled image visible
               briefly before the final message.
            */

            instruction.textContent =
                "❤️";

            setTimeout(
                showFinal,
                900
            );

        }, 1000);

    }, 850);

}


/* =========================================================
   FINAL SCREEN
========================================================= */

function showFinal() {

    mainScreen.classList.add(
        "hidden"
    );

    finalScreen.classList.remove(
        "hidden"
    );

}


/* =========================================================
   PHOTO MODAL
========================================================= */

function openPhotoModal() {

    renderPhotos();

    photoModal.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";

}


function closePhotoModal() {

    photoModal.classList.remove(
        "open"
    );

    document.body.style.overflow =
        "";

}


viewPhotosButton.addEventListener(
    "click",
    openPhotoModal
);


viewPhotosFinalButton.addEventListener(
    "click",
    openPhotoModal
);


closeModal.addEventListener(
    "click",
    closePhotoModal
);


photoModal.addEventListener(
    "click",
    function(e) {

        if (e.target === photoModal) {

            closePhotoModal();

        }

    }
);


/* =========================================================
   RENDER SUBMITTED PHOTOS
========================================================= */

function renderPhotos() {

    photoList.innerHTML = "";


    if (submittedPhotos.length === 0) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty-photos";

        empty.textContent =
            "Your photos will appear here 📸";

        photoList.appendChild(
            empty
        );

        return;

    }


    submittedPhotos.forEach(
        function(photo) {

            const item =
                document.createElement("div");

            item.className =
                "submitted-photo";


            const image =
                document.createElement("img");

            image.src =
                photo.image;

            image.alt =
                photo.title;


            const title =
                document.createElement("div");

            title.className =
                "submitted-photo-title";

            title.textContent =
                photo.title;


            item.appendChild(
                image
            );

            item.appendChild(
                title
            );

            photoList.appendChild(
                item
            );

        }
    );

}


/* =========================================================
   START
========================================================= */

buildPuzzle();


/*
   If she previously completed the hunt,
   don't automatically show the final screen.
   Keep the puzzle accessible so her photos
   remain available.
*/

if (progress >= 9) {

    instruction.textContent =
        "You did it! Tap the completed picture ❤️";

    setTimeout(() => {

        prepareAssembly();

    }, 100);

}

</script>

</body>
</html>
